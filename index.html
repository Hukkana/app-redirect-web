<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirect Builder</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <script>
      (function () {
        function supportsRenderedCornerShape() {
          if (!window.CSS || !CSS.supports || !CSS.supports("corner-shape", "squircle")) {
            return false;
          }

          var el = document.createElement("div");
          el.style.position = "absolute";
          el.style.width = "0";
          el.style.height = "0";
          el.style.overflow = "hidden";
          el.style.borderRadius = "50%";
          el.style.setProperty("corner-shape", "squircle");
          document.documentElement.appendChild(el);

          var computed = getComputedStyle(el).getPropertyValue("corner-shape").trim();
          document.documentElement.removeChild(el);

          return computed === "squircle";
        }

        var supportsCornerShape = supportsRenderedCornerShape();

        document.documentElement.classList.add(
          supportsCornerShape ? "supports-corner-shape" : "no-corner-shape"
        );
        document.documentElement.dataset.cornerShape = supportsCornerShape ? "squircle" : "unsupported";
      })();
    </script>
    <link rel="stylesheet" href="./styles.css">
    <script src="./config.js"></script>
    <script>
      (function () {
        var AUTO_REDIRECT_KEY = "redirect-builder:auto-redirect";
        var APP_CONFIG = window.APP_CONFIG || {};
        var SUPABASE_URL = APP_CONFIG.supabaseUrl || "";
        var SUPABASE_ANON_KEY = APP_CONFIG.supabaseAnonKey || "";
        var pathParts = window.location.pathname.split("/").filter(Boolean);
        var url = new URL(window.location.href);
        var redirectParam = url.searchParams.get("redirect");
        var isGitHubPagesProjectSite =
          window.location.hostname.endsWith(".github.io") && pathParts.length >= 1;
        var requestedId = "";

        function setMeta(name, content) {
          var element = document.querySelector('meta[name="' + name + '"]');
          if (!element) {
            element = document.createElement("meta");
            element.name = name;
            document.head.appendChild(element);
          }
          element.content = content;
        }

        function setLink(rel, href, sizes) {
          var selector = 'link[rel="' + rel + '"]';
          if (sizes) {
            selector += '[sizes="' + sizes + '"]';
          }

          var element = document.querySelector(selector);
          if (!element) {
            element = document.createElement("link");
            element.rel = rel;
            if (sizes) {
              element.sizes = sizes;
            }
            document.head.appendChild(element);
          }
          element.href = href;
        }

        function getAppleAppBannerContent(targetUrl) {
          try {
            var parsed = new URL(targetUrl);
            var host = parsed.hostname.replace(/^www\./, "");

            if (host === "x.com" || host === "twitter.com") {
              return "app-id=333903271, app-argument=" + targetUrl;
            }

            if (host === "chatgpt.com" || host === "chat.openai.com") {
              return "app-id=6448311069, app-argument=" + targetUrl;
            }
          } catch (error) {
            return "";
          }

          return "";
        }

        if (redirectParam) {
          requestedId = redirectParam;
        } else if (isGitHubPagesProjectSite) {
          if (pathParts.length >= 2 && pathParts[1] !== "index.html" && pathParts[1] !== "404.html") {
            requestedId = decodeURIComponent(pathParts[pathParts.length - 1]);
          }
        } else if (pathParts.length > 0) {
          var last = pathParts[pathParts.length - 1];
          if (last !== "index.html" && last !== "404.html") {
            requestedId = decodeURIComponent(last);
          }
        }

        if (!requestedId) {
          return;
        }

        if (!SUPABASE_URL || !SUPABASE_ANON_KEY) {
          return;
        }

        try {
          var apiUrl = SUPABASE_URL + "/rest/v1/rpc/get_redirect_by_id";

          fetch(apiUrl, {
            method: "POST",
            headers: {
              apikey: SUPABASE_ANON_KEY,
              Authorization: "Bearer " + SUPABASE_ANON_KEY,
              "Content-Type": "application/json"
            },
            body: JSON.stringify({ p_id: requestedId })
          })
            .then(function (response) {
              if (!response.ok) {
                throw new Error("Failed to fetch redirect");
              }
              return response.json();
            })
            .then(function (rows) {
              var entry = Array.isArray(rows) ? rows[0] : rows;
              if (!entry || !entry.url) {
                return;
              }

              document.title = entry.title || "Redirecting...";
              setMeta("apple-mobile-web-app-title", entry.title || "Redirect");
              setMeta("apple-mobile-web-app-capable", "yes");
              setMeta("apple-mobile-web-app-status-bar-style", "default");

              var appleAppBannerContent = getAppleAppBannerContent(entry.url);
              if (appleAppBannerContent) {
                setMeta("apple-itunes-app", appleAppBannerContent);
              }

              if (entry.icon_url) {
                setLink("icon", entry.icon_url);
                setLink("apple-touch-icon", entry.icon_url);
                setLink("apple-touch-icon-precomposed", entry.icon_url);
              }

              if (localStorage.getItem(AUTO_REDIRECT_KEY) !== "false" && !entry.app_scheme) {
                window.location.replace(entry.url);
              }
            })
            .catch(function (error) {
              console.error("Early redirect failed:", error);
            });
        } catch (error) {
          console.error("Early redirect failed:", error);
        }
      })();
    </script>
  </head>
  <body>
    <main class="page">
      <section class="card" id="builder-view">
        <p class="eyebrow">Redirect Builder</p>
        <h1>URLごとの専用リダイレクトページを作成</h1>
        <p class="lead">
          URL、タイトル、アイコン画像を設定すると、GitHub Pages で使える専用URLを発行します。
        </p>

        <div class="notice">
          Supabaseに保存するので、別の端末やブラウザでも同じリダイレクトを開けます。
        </div>

        <label class="toggle-row" for="auto-redirect-toggle">
          <span class="toggle-copy">
            <strong>即リダイレクト</strong>
            <small>ホーム画面に追加したいときだけ一時的にOFFにできます。</small>
          </span>
          <input id="auto-redirect-toggle" class="toggle-input" type="checkbox" checked>
          <span class="toggle-ui" aria-hidden="true"></span>
        </label>

        <form id="create-form" class="form">
          <input id="editing-id" name="editingId" type="hidden">
          <label class="field">
            <span>リダイレクト先URL</span>
            <input class="input squircle" id="url" name="url" type="url" placeholder="https://example.com" inputmode="url" required>
          </label>

          <label class="field">
            <span>アプリを直接開くURL（任意）</span>
            <input class="input squircle" id="app-scheme" name="appScheme" type="text" placeholder="chatgpt://" inputmode="url">
          </label>

          <label class="field">
            <span>タイトル</span>
            <input class="input squircle" id="title" name="title" type="text" placeholder="Example" maxlength="80" required>
          </label>

          <label class="field">
            <span>アイコン画像</span>
            <input class="input squircle file-input" id="icon" name="icon" type="file" accept="image/*" required>
          </label>

          <label class="toggle-row form-toggle" for="public-toggle">
            <span class="toggle-copy">
              <strong>みんなのリダイレクトに表示</strong>
              <small>OFFにすると、わたしのリダイレクトにだけ表示します。</small>
            </span>
            <input id="public-toggle" class="toggle-input" type="checkbox" checked>
            <span class="toggle-ui" aria-hidden="true"></span>
          </label>

          <fieldset class="icon-settings">
            <legend>アイコン調整</legend>
            <label class="field">
              <span>解像度</span>
              <input class="input squircle" id="icon-size" name="iconSize" type="number" min="64" max="1024" step="1" value="180" inputmode="numeric">
            </label>

            <label class="range-field">
              <span>横位置</span>
              <input id="icon-position-x" name="iconPositionX" type="range" min="0" max="100" value="50">
            </label>

            <label class="range-field">
              <span>縦位置</span>
              <input id="icon-position-y" name="iconPositionY" type="range" min="0" max="100" value="50">
            </label>
          </fieldset>

          <div class="preview-wrap" id="preview-wrap" hidden>
            <img id="preview-image" class="preview-image" alt="icon preview">
            <p id="preview-name" class="preview-name"></p>
          </div>

          <div class="form-actions">
            <button type="submit" class="button squircle" id="submit-button">作成</button>
            <button type="button" class="secondary-button squircle" id="cancel-edit-button" hidden>編集をやめる</button>
          </div>
        </form>

        <section id="result" class="result" hidden>
          <p class="result-label">発行されたURL</p>
          <div class="result-box">
            <a id="result-link" href="" target="_blank" rel="noreferrer"></a>
            <button type="button" class="copy-button squircle" id="copy-button">コピー</button>
          </div>
        </section>

        <section id="my-list" class="saved-list" hidden>
          <p class="result-label">わたしのリダイレクト</p>
          <div id="my-items" class="saved-items"></div>
        </section>

        <section id="all-list" class="saved-list" hidden>
          <p class="result-label">みんなのリダイレクト</p>
          <div id="all-items" class="saved-items"></div>
        </section>

        <p id="status" class="status" aria-live="polite"></p>
      </section>

      <section class="card redirect-card" id="redirect-view" hidden>
        <p class="eyebrow">Redirect</p>
        <h1 id="redirect-title">移動中です…</h1>
        <p class="lead" id="redirect-description">設定を確認しています。</p>
        <p class="redirect-link" id="redirect-link"></p>
        <button type="button" class="button squircle redirect-button" id="open-now-button" hidden>いま開く</button>
        <a class="secondary-button squircle redirect-fallback" id="web-fallback-button" href="" hidden>Web版を開く</a>
      </section>
    </main>

    <div class="modal-backdrop" id="delete-modal" hidden>
      <section class="modal-card" role="dialog" aria-modal="true" aria-labelledby="delete-modal-title">
        <p class="eyebrow">Confirm</p>
        <h2 id="delete-modal-title">このリダイレクトを削除しますか？</h2>
        <p class="modal-text" id="delete-modal-text"></p>
        <div class="modal-actions">
          <button type="button" class="secondary-button squircle" id="delete-cancel-button">キャンセル</button>
          <button type="button" class="saved-action delete squircle" id="delete-confirm-button">削除する</button>
        </div>
      </section>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./app.js"></script>
  </body>
</html>
